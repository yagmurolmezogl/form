<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Görevi 1 - Ortalanmış Animasyonlar</title>
    <style>
        /* SAYFA DÜZENİ (ORTALAMA İŞLEMİ) */
        body {
            margin: 0;
            height: 100vh; /* Tüm ekran yüksekliğini kapla */
            display: flex; /* Esnek kutu modeli */
            justify-content: center; /* Yatayda ortala */
            align-items: center; /* Dikeyde ortala */
            /* Arka plan rengi varsayılan (beyaz) bırakıldı */
        }

        /* Tüm kutular için genel ortak özellikler */
        div {
            width: 100px;
            height: 100px;
            margin: 15px; /* Kutular arası boşluk */
            text-align: center;
            line-height: 100px; 
            color: white;
            font-family: Arial, sans-serif;
            font-weight: bold;
            border-radius: 10px;
        }

        /* --- 1. Yukarı Aşağı Gidip Gelen --- */
        .kutu1 {
            background-color: #e74c3c;
            position: relative;
            animation-name: yukariAsagi;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        @keyframes yukariAsagi {
            from { top: -20px; }
            to { top: 20px; }
        }

        /* --- 2. Büyüyüp Küçülen ve Rengi Değişen --- */
        .kutu2 {
            background-color: #3498db;
            animation-name: buyuRenklendir;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        @keyframes buyuRenklendir {
            0% {
                transform: scale(1);
                background-color: #3498db;
            }
            100% {
                transform: scale(1.3);
                background-color: #8e44ad;
            }
        }

        /* --- 3. Gitgide Transparan Değeri Artan ve Azalan --- */
        .kutu3 {
            background-color: #2ecc71;
            animation-name: transparanlik;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        @keyframes transparanlik {
            from { opacity: 1; }
            to { opacity: 0.2; }
        }

        /* --- 4. Sağa Sola Giden Gelen --- */
        .kutu4 {
            background-color: #f1c40f;
            color: black;
            position: relative;
            animation-name: sagaSola;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        @keyframes sagaSola {
            from { left: -20px; }
            to { left: 20px; }
        }

        /* --- 5. Dönen --- */
        .kutu5 {
            background-color: #34495e; /* Slayttaki örneğe uygun koyu gri ton */
            animation-name: donme;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }

        @keyframes donme {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="kutu1"></div>

    <div class="kutu2"></div>

    <div class="kutu3"></div>

    <div class="kutu4"></div>

    <div class="kutu5"></div>

</body>
</html>
