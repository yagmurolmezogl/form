<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animasyon</title>
    <style>
        
        body {
            margin: 0;
            height: 100vh; 
            display: flex;
            justify-content: center; 
            align-items: center;
        }

        div {
            width: 100px;
            height: 100px;
            margin: 15px; 
            text-align: center;
            line-height: 100px; 
            color: white;
            font-family: Arial, sans-serif;
            font-weight: bold;
            border-radius: 10px;
        }

        .kutu1 {
            background-color: #e74c3c;
            position: relative;
            animation-name: yukariAsagi;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        @keyframes yukariAsagi {
            from { top: -20px; }
            to { top: 20px; }
        }

        .kutu2 {
            background-color: #3498db;
            animation-name: buyuRenklendir;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        @keyframes buyuRenklendir {
            0% {
                transform: scale(1);
                background-color: #3498db;
            }
            100% {
                transform: scale(1.3);
                background-color: #8e44ad;
            }
        }

        .kutu3 {
            background-color: #2ecc71;
            animation-name: transparanlik;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        @keyframes transparanlik {
            from { opacity: 1; }
            to { opacity: 0.2; }
        }

        .kutu4 {
            background-color: #f1c40f;
            color: black;
            position: relative;
            animation-name: sagaSola;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        @keyframes sagaSola {
            from { left: -20px; }
            to { left: 20px; }
        }

        .kutu5 {
            background-color: #34495e; 
            animation-name: donme;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }

        @keyframes donme {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="kutu1"></div>

    <div class="kutu2"></div>

    <div class="kutu3"></div>

    <div class="kutu4"></div>

    <div class="kutu5"></div>

</body>
</html>
