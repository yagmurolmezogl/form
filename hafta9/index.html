<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enik</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    text-align: center;
    transition: background 0.5s;
    font-family: Arial;
  }

  #circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #ffd700;
    margin: 0 auto 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .box-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
  }

  .box {
    width: 160px;
    height: 120px;
    background: #f58634;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    flex-direction: column;
  }

  img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .btns {
    margin-top: 10px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
</style>

</head>
<body>


<div id="circle">
  <img id="circleImg" src="" />
</div>

<div class="box-container">
  <div>
    <div class="box"><img id="img1" src="images (1).jpeg" /></div>
    <div class="btns">
      <button onclick="showImg('img1')">Göster</button>
      <button onclick="hideImg('img1')">Gizle</button>
    </div>
  </div>

  <div>
    <div class="box"><img id="img2" src="images.jpeg" /></div>
    <div class="btns">
      <button onclick="showImg('img2')">Göster</button>
      <button onclick="hideImg('img2')">Gizle</button>
    </div>
  </div>

  <div>
    <div class="box"><img id="img3" src="images (2).jpeg" /></div>
    <div class="btns">
      <button onclick="showImg('img3')">Göster</button>
      <button onclick="hideImg('img3')">Gizle</button>
    </div>
  </div>
</div>

<script>
  function randomBg() {
    const r = Math.floor(Math.random()*256);
    const g = Math.floor(Math.random()*256);
    const b = Math.floor(Math.random()*256);
    document.body.style.background = `rgb(${r},${g},${b})`;
  }

  const circleImages = [
    "indir (1).jpeg", "indir (2).jpeg", "indir (3).jpeg", "indir (4).jpeg", "indir (5).jpeg",
    "indir (6).jpeg", "indir (7).jpeg", "indir (8).jpeg", "indir (9).jpeg", "indir.jpeg"
  ];

  function randomCircleImg() {
    const pick = Math.floor(Math.random() * circleImages.length);
    document.getElementById("circleImg").src = circleImages[pick];
  }

  function hideImg(id) {
    document.getElementById(id).style.display = "none";
  }

  function showImg(id) {
    document.getElementById(id).style.display = "block";
  }

  randomBg();
  randomCircleImg();
</script>
</body>
</html>
