        .container {

        .card {
            border: none;

            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        .card-title a {
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            color: #4D2C91;
            transition: color 0.3s ease;
        }

        .card-title a:hover {
            color: #FF3FA4;
        }
    </style>
</head>
